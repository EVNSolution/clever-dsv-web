server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.mjs$ {
    try_files $uri =404;
    types { application/javascript mjs; }
    expires 1h;
  }

  location ~* \.(js|css|woff2|svg|webp|png|jpg|jpeg)$ {
    try_files $uri =404;
    expires 1h;
  }
}
